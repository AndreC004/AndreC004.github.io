<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dulce Pasado</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f8f1e8;color:#3e2b1e;}
header{position:fixed;top:0;left:0;right:0;background:#fffaf5;display:flex;justify-content:space-between;align-items:center;padding:10px 15px;}
header img{height:45px;cursor:pointer;}
nav{display:flex;gap:10px;}
nav a{text-decoration:none;color:#5c3b1e;font-weight:bold;}
.menu{display:none;flex-direction:column;cursor:pointer;}
.menu div{height:3px;width:25px;background:#5c3b1e;margin:4px 0;}
@media(max-width:800px){
nav{position:fixed;right:-220px;top:0;width:200px;height:100%;flex-direction:column;background:#fff;padding:70px 20px;transition:.3s;}
nav.show{right:0;}
.menu{display:flex;}
}
#banner{text-align:center;padding:110px 20px 50px;background:#b28855;color:#fff;}
section{padding:30px 20px;max-width:900px;margin:auto;}
.producto{background:#fff;padding:15px;margin:15px 0;text-align:center;border-radius:10px;}
.producto img{max-width:100%;border-radius:10px;}
button{background:#b28855;color:#fff;border:none;padding:8px 15px;border-radius:6px;margin-top:10px;cursor:pointer;}
#lista{list-style:none;padding:0;}
#lista li{background:#fff;margin:5px 0;padding:8px;border-radius:6px;display:flex;justify-content:space-between;}
footer{text-align:center;padding:20px;background:#f0e5db;}
</style>
</head>
<body>

<header>
  <a href="#banner"><img src="IMG_5514.png" alt="Logo"></a>
  <div class="menu" onclick="toggle()"><div></div><div></div><div></div></div>
  <nav id="nav">
    <a href="#banner" onclick="closeMenu()">Inicio</a>
    <a href="#productos" onclick="closeMenu()">Productos</a>
    <a href="#pedido" onclick="closeMenu()">Pedido</a>
  </nav>
</header>

<section id="banner">
  <h1>Pan artesanal hecho con amor</h1>
  <p>Directo de San Luis Potosí a tu mesa</p>
</section>

<section id="productos">
  <h2>Productos</h2>
  <div class="producto">
    <h3>Empanadas</h3><img src="IMG_6484.jpeg">
    <p>$15 c/u (mín. 5)</p><button onclick="add('Empanadas')">Agregar</button>
  </div>
  <div class="producto">
    <h3>Rosquitas</h3><img src="IMG_6479.jpeg">
    <p>$4 c/u (mín. 10)</p><button onclick="add('Rosquitas')">Agregar</button>
  </div>
  <div class="producto">
    <h3>Pan Español</h3><img src="IMG_1364.jpeg">
    <p>$15 c/u (mín. 5)</p><button onclick="add('Pan Español')">Agregar</button>
  </div>
  <div class="producto">
    <h3>Conchas</h3><img src="IMG_6521.jpeg">
    <p>$20 c/u (mín. 4)</p><button onclick="add('Conchas')">Agregar</button>
  </div>
</section>

<section id="pedido">
  <h2>🧺 Tu pedido</h2>
  <ul id="lista"></ul>
  <button onclick="send()">Enviar por WhatsApp</button>
</section>

<footer><p>Gracias por elegir Dulce Pasado 🍞</p></footer>

<script>
function toggle(){document.getElementById('nav').classList.toggle('show');}
function closeMenu(){document.getElementById('nav').classList.remove('show');}

let cart=[];
function add(p){
  let i=cart.findIndex(x=>x.n===p);
  if(i>=0){cart[i].q++;}else{cart.push({n:p,q:1});}
  update();
}
function del(i){cart.splice(i,1);update();}
function update(){
  let l=document.getElementById('lista');l.innerHTML='';
  cart.forEach((x,i)=>l.innerHTML+=`<li>${x.q} × ${x.n} <button onclick="del(${i})">X</button></li>`);
}
function send(){
  if(cart.length==0){alert('Carrito vacío');return;}
  let m='Hola! Me gustaría pedir:\n';
  cart.forEach(x=>m+=`${x.q} × ${x.n}\n`);
  window.open(`https://wa.me/524445481177?text=${encodeURIComponent(m)}`);
}
</script>

</body>
</html>
